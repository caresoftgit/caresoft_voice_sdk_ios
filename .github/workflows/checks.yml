name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup-sdk.py
      - run: bash demo/Tests/check-demo.sh
      - run: xcrun swift-format lint --strict --recursive demo/CaresoftVoiceDemo demo/Tests Examples
